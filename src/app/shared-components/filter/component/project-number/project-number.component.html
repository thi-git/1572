<div class="project-number" [class]="setDisplay()">
  <div class="test">
    <mat-expansion-panel [(expanded)]="panelOpen" class="panel">
      <mat-expansion-panel-header>
        <mat-panel-title>
        專案編號
        </mat-panel-title>
      </mat-expansion-panel-header>
      <ng-container *ngIf="isData">
        <app-checkbox-tree
        [custom]="'project_number'"
        [treeList]="treeList"
        (getName)="getName($event)">
        </app-checkbox-tree>
      </ng-container>
    </mat-expansion-panel>
  </div>
</div>
