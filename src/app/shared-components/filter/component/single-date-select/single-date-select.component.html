<div [ngClass]="setPosition()">
  <div class="title">
    <span>資料日期：</span>
  </div>
  <mat-expansion-panel [(expanded)]="panelOpen" class="panel">
    <mat-expansion-panel-header>
      <mat-panel-title>
        {{ select }}
      </mat-panel-title>
    </mat-expansion-panel-header>
    <mat-radio-group class="radio-group" [(ngModel)]="select">
      <mat-radio-button class="radio-button" *ngFor="let type of types" [value]="type" (change)="selectChange(type)" (click)="close()">
        {{ type }}
      </mat-radio-button>
    </mat-radio-group>
  </mat-expansion-panel>
</div>
